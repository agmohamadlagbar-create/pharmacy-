
<style>
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes ride { 0%{transform:translateX(0)} 50%{transform:translateX(6px)} 100%{transform:translateX(0)} }
  @keyframes checkPop { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-8px) rotate(5deg)} }
  @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.4)} }
  @keyframes dotMove { 0%{opacity:0;transform:scale(0.5)} 50%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(0.5)} }
</style>

<div style="display:flex;justify-content:center;padding:1rem 0.5rem">
  <div style="width:340px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;font-family:var(--font-sans)">
    
    <!-- Header -->
    <div id="status-header" style="padding:16px 18px 14px;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:11px;color:var(--color-text-tertiary);letter-spacing:.04em">ORDER #4821</span>
        <span id="eta-label" style="font-size:11px;color:var(--color-text-tertiary)">Est. 25–35 min</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span id="status-text" style="font-size:17px;font-weight:500;color:var(--color-text-primary)">Getting ready</span>
        <span id="status-dot" style="width:8px;height:8px;border-radius:50%;background:#EF9F27;animation:pulse 1.2s infinite"></span>
      </div>
    </div>

    <!-- Progress bar -->
    <div style="padding:14px 18px 12px">
      <div style="height:5px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden">
        <div id="progress-bar" style="height:100%;border-radius:99px;transition:width 0.7s cubic-bezier(.4,0,.2,1);background:#EF9F27;width:15%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <span id="step-getting" class="step-label" style="font-size:10px;font-weight:500;color:#EF9F27">Getting ready</span>
        <span id="step-ready" class="step-label" style="font-size:10px;color:var(--color-text-tertiary)">Ready</span>
        <span id="step-way" class="step-label" style="font-size:10px;color:var(--color-text-tertiary)">On the way</span>
        <span id="step-delivered" class="step-label" style="font-size:10px;color:var(--color-text-tertiary)">Delivered</span>
      </div>
    </div>

    <!-- Animation area -->
    <div style="height:160px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
      
      <!-- State 0: Getting ready (chef hat + steam) -->
      <div id="anim-0" style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <!-- chef hat -->
          <ellipse cx="40" cy="52" rx="24" ry="10" fill="#E8EAEC"/>
          <rect x="16" y="42" width="48" height="14" rx="2" fill="#D4D6D8"/>
          <ellipse cx="40" cy="36" rx="16" ry="18" fill="#F5F5F7"/>
          <ellipse cx="27" cy="36" rx="8" ry="11" fill="#ECEDEF"/>
          <ellipse cx="53" cy="36" rx="8" ry="11" fill="#ECEDEF"/>
          <!-- steam -->
          <path id="s1" d="M28 30Q26 24 28 18" stroke="#B0B2B4" stroke-width="2" fill="none" stroke-linecap="round" style="animation:wave 1.2s ease-in-out infinite"/>
          <path id="s2" d="M40 28Q38 22 40 16" stroke="#B0B2B4" stroke-width="2" fill="none" stroke-linecap="round" style="animation:wave 1.4s ease-in-out infinite .2s"/>
          <path id="s3" d="M52 30Q50 24 52 18" stroke="#B0B2B4" stroke-width="2" fill="none" stroke-linecap="round" style="animation:wave 1.3s ease-in-out infinite .4s"/>
        </svg>
        <span style="font-size:12px;color:var(--color-text-secondary)">Preparing your order…</span>
      </div>

      <!-- State 1: Ready to pick up (bag bouncing) -->
      <div id="anim-1" style="display:none;flex-direction:column;align-items:center;gap:6px">
        <div style="animation:bounce 1s ease-in-out infinite">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <rect x="14" y="26" width="44" height="36" rx="8" fill="#3B8BD4"/>
            <rect x="14" y="34" width="44" height="4" fill="#2A72B8"/>
            <path d="M24 26V20a12 12 0 0124 0v6" stroke="#2A72B8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <rect x="30" y="46" width="12" height="6" rx="3" fill="#fff" opacity=".7"/>
            <circle cx="36" cy="49" r="2" fill="#3B8BD4"/>
          </svg>
        </div>
        <span style="font-size:12px;color:var(--color-text-secondary)">Ready for pickup!</span>
      </div>

      <!-- State 2: On the way (bike + motion dots) -->
      <div id="anim-2" style="display:none;flex-direction:column;align-items:center;gap:8px">
        <div style="position:relative;width:120px;height:90px">
          <!-- road dots -->
          <div style="position:absolute;bottom:12px;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:center">
            <div style="width:6px;height:2px;border-radius:1px;background:var(--color-border-secondary);animation:dotMove 1s .0s infinite"></div>
            <div style="width:6px;height:2px;border-radius:1px;background:var(--color-border-secondary);animation:dotMove 1s .15s infinite"></div>
            <div style="width:6px;height:2px;border-radius:1px;background:var(--color-border-secondary);animation:dotMove 1s .3s infinite"></div>
            <div style="width:6px;height:2px;border-radius:1px;background:var(--color-border-secondary);animation:dotMove 1s .45s infinite"></div>
            <div style="width:6px;height:2px;border-radius:1px;background:var(--color-border-secondary);animation:dotMove 1s .6s infinite"></div>
          </div>
          <div style="position:absolute;top:4px;left:50%;transform:translateX(-50%);animation:ride 0.9s ease-in-out infinite">
            <svg width="80" height="68" viewBox="0 0 80 68">
              <!-- wheels -->
              <circle cx="20" cy="52" r="12" fill="none" stroke="#444" stroke-width="3"/>
              <circle cx="60" cy="52" r="12" fill="none" stroke="#444" stroke-width="3"/>
              <circle cx="20" cy="52" r="3" fill="#666"/>
              <circle cx="60" cy="52" r="3" fill="#666"/>
              <!-- frame -->
              <path d="M20 52L36 28L60 52Z" fill="none" stroke="#555" stroke-width="2.5"/>
              <path d="M36 28L60 52" stroke="#555" stroke-width="2.5"/>
              <path d="M36 28L36 18" stroke="#555" stroke-width="2.5"/>
              <path d="M30 18L44 18" stroke="#555" stroke-width="3" stroke-linecap="round"/>
              <path d="M55 52L55 32L64 30" stroke="#555" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <!-- rider -->
              <circle cx="36" cy="12" r="8" fill="#E8593C"/>
              <!-- bag on back -->
              <rect x="38" y="16" width="14" height="12" rx="3" fill="#3B8BD4"/>
            </svg>
          </div>
        </div>
        <span style="font-size:12px;color:var(--color-text-secondary)">Courier is on the way</span>
      </div>

      <!-- State 3: Delivered (checkmark pop) -->
      <div id="anim-3" style="display:none;flex-direction:column;align-items:center;gap:6px">
        <div style="width:72px;height:72px;border-radius:50%;background:#EAF3DE;display:flex;align-items:center;justify-content:center;animation:checkPop 0.5s cubic-bezier(.4,0,.2,1) forwards">
          <svg width="36" height="36" viewBox="0 0 36 36">
            <path d="M6 18L14 26L30 10" stroke="#3B6D11" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <span style="font-size:12px;color:var(--color-text-secondary)">Order delivered!</span>
      </div>

    </div>

    <!-- Map area -->
    <div style="position:relative;overflow:hidden;height:140px;background:#EDF0F2">
      <!-- Simulated map -->
      <svg width="100%" height="140" viewBox="0 0 340 140" style="display:block">
        <!-- map bg roads -->
        <rect width="340" height="140" fill="#E8EDF2"/>
        <!-- blocks -->
        <rect x="0" y="0" width="80" height="55" rx="2" fill="#F0F3F5"/>
        <rect x="90" y="0" width="100" height="55" rx="2" fill="#F0F3F5"/>
        <rect x="200" y="0" width="140" height="55" rx="2" fill="#F0F3F5"/>
        <rect x="0" y="65" width="60" height="75" rx="2" fill="#F0F3F5"/>
        <rect x="70" y="65" width="80" height="75" rx="2" fill="#F0F3F5"/>
        <rect x="160" y="65" width="90" height="75" rx="2" fill="#F0F3F5"/>
        <rect x="260" y="65" width="80" height="75" rx="2" fill="#F0F3F5"/>
        <!-- roads (horizontal) -->
        <rect x="0" y="55" width="340" height="10" fill="#D8DDE3"/>
        <!-- roads (vertical) -->
        <rect x="80" y="0" width="10" height="55" fill="#D8DDE3"/>
        <rect x="190" y="0" width="10" height="55" fill="#D8DDE3"/>
        <rect x="60" y="65" width="10" height="75" fill="#D8DDE3"/>
        <rect x="150" y="65" width="10" height="75" fill="#D8DDE3"/>
        <rect x="250" y="65" width="10" height="75" fill="#D8DDE3"/>
        <!-- route path -->
        <path id="route-path" d="M50 110L50 60L200 60L200 25" stroke="#3B8BD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 4" opacity="0.7"/>
        <!-- destination marker (house) -->
        <g transform="translate(188,4)">
          <polygon points="12,0 24,12 22,12 22,24 2,24 2,12 0,12" fill="#E8593C"/>
          <rect x="8" y="15" width="8" height="9" fill="#fff" opacity=".8"/>
        </g>
        <!-- courier dot -->
        <g id="courier-dot">
          <circle cx="50" cy="108" r="9" fill="#3B8BD4" opacity="0.2"/>
          <circle cx="50" cy="108" r="6" fill="#3B8BD4"/>
          <circle cx="50" cy="108" r="2.5" fill="#fff"/>
        </g>
      </svg>
      <!-- map label -->
      <div style="position:absolute;bottom:8px;right:10px;font-size:10px;color:#9AA0A8;background:rgba(255,255,255,0.75);padding:2px 6px;border-radius:4px">Live tracking</div>
    </div>

    <!-- Step controls -->
    <div style="padding:12px 18px;border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between">
      <button onclick="prevStep()" style="font-size:12px;padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer">← Prev</button>
      <span id="step-indicator" style="font-size:11px;color:var(--color-text-tertiary)">Step 1 / 4</span>
      <button onclick="nextStep()" style="font-size:12px;padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer">Next →</button>
    </div>

  </div>
</div>

<script>
const states = [
  {
    label: 'Getting ready',
    eta: 'Est. 25–35 min',
    progress: '15%',
    barColor: '#EF9F27',
    dotColor: '#EF9F27',
    anim: 0,
    courier: {cx:50,cy:108},
    steps: [1,0,0,0]
  },
  {
    label: 'Ready to pick up',
    eta: 'Est. 15–20 min',
    progress: '38%',
    barColor: '#EF9F27',
    dotColor: '#EF9F27',
    anim: 1,
    courier: {cx:50,cy:75},
    steps: [1,1,0,0]
  },
  {
    label: 'On the way',
    eta: 'Est. 8–12 min',
    progress: '68%',
    barColor: '#3B8BD4',
    dotColor: '#3B8BD4',
    anim: 2,
    courier: {cx:120,cy:60},
    steps: [1,1,1,0]
  },
  {
    label: 'Delivered',
    eta: 'Delivered just now',
    progress: '100%',
    barColor: '#639922',
    dotColor: '#639922',
    anim: 3,
    courier: {cx:200,cy:25},
    steps: [1,1,1,1]
  }
];

const stepIds = ['step-getting','step-ready','step-way','step-delivered'];
const stepColors = ['#EF9F27','#EF9F27','#3B8BD4','#639922'];

let current = 0;

function render() {
  const s = states[current];
  
  document.getElementById('status-text').textContent = s.label;
  document.getElementById('eta-label').textContent = s.eta;
  
  const bar = document.getElementById('progress-bar');
  bar.style.width = s.progress;
  bar.style.background = s.barColor;
  
  const dot = document.getElementById('status-dot');
  dot.style.background = s.dotColor;
  dot.style.animation = s.anim === 3 ? 'none' : 'pulse 1.2s infinite';
  
  // Step labels
  stepIds.forEach((id,i) => {
    const el = document.getElementById(id);
    const active = current >= i;
    const c = active ? stepColors[current] : 'var(--color-text-tertiary)';
    el.style.color = c;
    el.style.fontWeight = i === current ? '500' : '400';
  });
  
  // Show correct anim
  for(let i=0;i<4;i++){
    const el = document.getElementById('anim-'+i);
    el.style.display = i===s.anim ? 'flex' : 'none';
  }
  
  // Move courier dot
  const cd = document.getElementById('courier-dot');
  const cx = s.courier.cx, cy = s.courier.cy;
  cd.querySelectorAll('circle').forEach(c => {
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
  });
  
  document.getElementById('step-indicator').textContent = `Step ${current+1} / 4`;
}

function nextStep() {
  if(current < 3) { current++; render(); }
}
function prevStep() {
  if(current > 0) { current--; render(); }
}

render();
</script>
