name: online_store_mobile
description: Online store auth starter (User/Shop toggle)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  image_picker: ^1.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  google_fonts: ^6.0.0
  flutter_stripe: ^12.5.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  signalr_netcore: ^1.3.7
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.1
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
