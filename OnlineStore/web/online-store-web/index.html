<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LagbarShop — Your premium online marketplace for electronics, fashion, food and more." />
  <meta name="theme-color" content="#0f172a" />
  <!-- Resource hints for LCP discovery and network dependency optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Asynchronous font loading to prevent render-blocking -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </noscript>
  <link rel="icon" type="image/svg+xml" href="/lagbarshop-icon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/lagbarshop-icon-64.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/lagbarshop-icon-32.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/lagbarshop-icon-192.png" />
  <title>LagbarShop</title>
  <script>
    // Apply saved theme before first paint to prevent flash
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
